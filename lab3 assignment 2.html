<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Easy Registration</title>
</head>
<body>

    <h1>Sign Up Now!</h1>
    
    <form> 
        
        <label for="name">Your Name:</label><br>
        <input type="text" id="name" name="user_name"><br><br>

        <label for="email">Your Email:</label><br>
        <input type="email" id="email" name="user_email"><br><br>

        <label for="password">Choose Password:</label><br>
        <input type="password" id="password" name="user_password"><br><br>

        <label>Gender:</label><br>
        <input type="radio" id="male" name="gender" value="Male">
        <label for="male">Male</label>
        
        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label>
        
        <input type="radio" id="other" name="gender" value="Other">
        <label for="other">Other</label><br><br>

        <label for="bio">Tell Us About Yourself:</label><br>
        <textarea id="bio" name="user_bio" rows="4" cols="50"></textarea><br><br>

        <input type="submit" value="Register">

    </form>

</body>
</html>
